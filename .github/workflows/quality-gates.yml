name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - feature/admin-ops-phase-4-customer-follow-up-2026-11-05
      - feature/admin-ops-phase-5-procurement-2026-11-05
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - audit/**
      - feature/admin-ops-phase-5-procurement-2026-11-05
      - feature/ui-overhaul-premium-enterprise-2026-11-06
  workflow_run:
    workflows:
      - Dependency Lock Refresh
    types: [completed]
    branches:
      - feature/ui-overhaul-premium-enterprise-2026-11-06
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build, lint, regression, and responsive browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Install Firebase CLI for Firestore emulator tests
        run: npm install --global firebase-tools

      - name: Build production bundle
        run: npm run build

      - name: Lint source
        run: npm run lint

      - name: Run regression contracts
        run: npm test

      - name: Run PRD and Firestore security contracts
        run: npm run test:prd

      - name: Install Playwright for responsive browser smoke
        run: npm install --no-save --no-package-lock playwright@1.64.1

      - name: Install Chromium for responsive browser smoke
        run: npx playwright install --with-deps chromium

      - name: Run responsive browser smoke
        run: node scripts/browser-responsive-smoke.mjs

      - name: Run keyboard and focus QA
        run: node scripts/phase-9-keyboard-focus-qa.mjs

      - name: Upload responsive and accessibility QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-9-browser-accessibility-qa
          path: |
            output/browser-smoke/
            output/phase-9/
          if-no-files-found: ignore
          retention-days: 7
